# Stop metadata for the pakistan leg - hand-maintained from here on.
# See README.md for field meanings and the editing workflow.
#
# Taxila/Islamabad/Lahore were each split across two adjacent-day book
# sections by build_stops.py's generic compound-splitting (same mechanism
# that gives Isfahan/Kabul their "-2" repeat-visit slugs) - but these were a
# single continuous stay, not a return visit, so they've been merged by hand
# into one stop each with a better-matched excerpt. The Pakistan mileage
# total was attached to Peshawar (first stop) by page-layout accident in the
# book PDF - moved to Lahore (last stop), matching every other leg's
# convention of the running total landing on the leg's final stop.

[[stop]]
slug = "peshawar"
name = "Peshawar"
date_start = "1976-11-11"
date_end = "1976-11-13"
narrative_excerpt = "G/M: Colin has re-appeared, to our great delight, especially after we heard his story. He had stopped for a cuppa coming up the Pass and when he got back into his Land Rover, he threw his coat on the seat. When he reached towards the pocket to get a cigarette, he saw a movement and it was a small snake."
mileage_note = ""
lat = 34.014444444
lon = 71.5675
wikidata = "Q1113311"
wikipedia = "https://en.wikipedia.org/wiki/Peshawar"

